<svg width="860" height="190" viewBox="0 0 860 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#132238" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="860" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: url(#titleGrad);
        animation: fadeSlide 0.9s ease-out both;
      }
      .subtitle {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        font-weight: 600;
        fill: #94a3b8;
        letter-spacing: 0.5px;
        animation: fadeSlide 1.2s ease-out both;
      }
      .wave-hand {
        font-size: 40px;
        transform-origin: 545px 86px;
        animation: wave 2.2s ease-in-out infinite;
        display: inline-block;
      }
      .trace {
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        animation: drawTrace 4s ease-in-out infinite alternate;
      }
      .trace-slow {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: drawTrace 5.5s ease-in-out infinite alternate-reverse;
      }
      .node-pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }
      .node-pulse-delay {
        animation: pulse 2.4s ease-in-out 1.2s infinite;
      }
      @keyframes wave {
        0%, 60%, 100% { transform: rotate(0deg); }
        10% { transform: rotate(16deg); }
        20% { transform: rotate(-10deg); }
        30% { transform: rotate(16deg); }
        40% { transform: rotate(-6deg); }
        50% { transform: rotate(10deg); }
      }
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawTrace {
        0% { stroke-dashoffset: 180; opacity: 0.25; }
        100% { stroke-dashoffset: 0; opacity: 0.85; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; r: 3.5; }
        50% { opacity: 1; r: 5.5; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="857" height="187" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Left Circuit Traces -->
  <path class="trace" d="M 28 45 L 75 45 L 95 65 L 145 65" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
  <path class="trace-slow" d="M 28 145 L 85 145 L 110 120 L 165 120" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle class="node-pulse" cx="145" cy="65" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle class="node-pulse-delay" cx="165" cy="120" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="28" cy="45" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="28" cy="145" r="3" fill="#10b981" opacity="0.7" />

  <!-- Right Circuit Traces -->
  <path class="trace-slow" d="M 832 45 L 785 45 L 765 65 L 715 65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" />
  <path class="trace" d="M 832 145 L 775 145 L 750 120 L 695 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle class="node-pulse-delay" cx="715" cy="65" r="4" fill="#f59e0b" filter="url(#glow)" />
  <circle class="node-pulse" cx="695" cy="120" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="832" cy="45" r="3" fill="#f59e0b" opacity="0.7" />
  <circle cx="832" cy="145" r="3" fill="#38bdf8" opacity="0.7" />

  <!-- Centered Animated Text -->
  <text x="412" y="88" text-anchor="middle" class="title">Hi, I'm Alen</text>
  <text x="545" y="88" text-anchor="middle" class="wave-hand">👋</text>
  <text x="430" y="128" text-anchor="middle" class="subtitle">Software Developer  •  Electronics &amp; Electrical Hobbyist</text>
</svg>
